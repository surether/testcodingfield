name: Deploy Subject Line Typing to GitHub Pages

on:
  push:
    branches:
      - "첫번째도전"
    paths:
      - "subject-line-typing/**"
      - ".github/workflows/subject-line-typing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "subject-line-typing-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: subject-line-typing
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
